name: Scrape snow depth

on:
  schedule:
    # 06:00 JST = 21:00 UTC (previous day)
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape snow depth
        run: python scrape_snow.py

      - name: Commit and push if changed
        run: |
          git config user.name "snow-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snow_data.json
          git diff --staged --quiet || git commit -m "Update snow depth data [automated]"
          git push
